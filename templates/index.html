<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klasifikasi Citra Real atau Fake</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            padding: 40px;
            width: 420px;
            max-width: 90vw;
            text-align: center;
        }
        h1 { font-size: 22px; color: #222; margin-bottom: 6px; }
        p.subtitle { color: #777; font-size: 14px; margin-bottom: 24px; }
        .dropzone {
            border: 2px dashed #c4c4c4;
            border-radius: 12px;
            padding: 28px 16px;
            color: #888;
            font-size: 14px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }
        .dropzone:hover, .dropzone.dragover { border-color: #667eea; background: #f5f7ff; }
        .dropzone input { display: none; }
        .preview { margin-top: 16px; }
        .preview img {
            max-width: 100%;
            max-height: 220px;
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
        }
        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #5a6fd6; }
        button:disabled { background: #b8c0f0; cursor: not-allowed; }
        .result { margin-top: 20px; padding: 16px; border-radius: 10px; display: none; }
        .result.real { background: #e8f7ee; border: 1px solid #3cba6f; color: #1c7c45; }
        .result.fake { background: #fdeeee; border: 1px solid #e45c5c; color: #b33232; }
        .result h2 { font-size: 24px; margin-bottom: 4px; }
        .result p { font-size: 14px; color: inherit; opacity: 0.85; }
        .error { margin-top: 16px; color: #b33232; font-size: 14px; display: none; }
        .spinner {
            display: none;
            margin: 20px auto 0;
            width: 34px; height: 34px;
            border: 4px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <h1>Klasifikasi Citra Real atau Fake</h1>
        <p class="subtitle">Unggah gambar untuk diklasifikasikan oleh model</p>

        <div class="dropzone" id="dropzone">
            <input type="file" id="fileInput" accept="image/*">
            <span>Klik di sini atau letakkan gambar</span>
        </div>

        <div class="preview" id="preview"></div>

        <button id="classifyBtn" disabled>Klasifikasi</button>
        <div class="spinner" id="spinner"></div>
        <div class="error" id="error"></div>
        <div class="result" id="result">
            <h2 id="resultLabel"></h2>
            <p id="resultConf"></p>
        </div>
    </div>

    <script>
        const dropzone = document.getElementById("dropzone");
        const fileInput = document.getElementById("fileInput");
        const preview = document.getElementById("preview");
        const classifyBtn = document.getElementById("classifyBtn");
        const spinner = document.getElementById("spinner");
        const errorBox = document.getElementById("error");
        const result = document.getElementById("result");
        const resultLabel = document.getElementById("resultLabel");
        const resultConf = document.getElementById("resultConf");

        let selectedFile = null;

        dropzone.addEventListener("click", () => fileInput.click());
        dropzone.addEventListener("dragover", (e) => {
            e.preventDefault();
            dropzone.classList.add("dragover");
        });
        dropzone.addEventListener("dragleave", () => dropzone.classList.remove("dragover"));
        dropzone.addEventListener("drop", (e) => {
            e.preventDefault();
            dropzone.classList.remove("dragover");
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener("change", () => {
            if (fileInput.files.length) handleFile(fileInput.files[0]);
        });

        function handleFile(file) {
            selectedFile = file;
            result.style.display = "none";
            errorBox.style.display = "none";
            preview.innerHTML = "";
            const img = document.createElement("img");
            img.src = URL.createObjectURL(file);
            preview.appendChild(img);
            classifyBtn.disabled = false;
        }

        classifyBtn.addEventListener("click", async () => {
            if (!selectedFile) return;
            classifyBtn.disabled = true;
            spinner.style.display = "block";
            errorBox.style.display = "none";
            result.style.display = "none";

            const form = new FormData();
            form.append("file", selectedFile);

            try {
                const res = await fetch("/predict", { method: "POST", body: form });
                let data = {};
                try { data = await res.json(); } catch (e) { data = {}; }
                if (!res.ok) throw new Error(data.error || "Prediksi gagal");
                resultLabel.textContent = data.label;
                resultConf.textContent = "Tingkat keyakinan: " + (data.confidence * 100).toFixed(2) + "%";
                result.className = "result " + data.label.toLowerCase();
                result.style.display = "block";
            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.style.display = "block";
            } finally {
                spinner.style.display = "none";
                classifyBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
